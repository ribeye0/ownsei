[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ownsei"
version = "0.2.1"
description = "Local Japanese audio transcription and Chinese subtitle translation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16",
    "pydantic>=2.11",
    "numpy>=2.2",
    "pysubs2>=1.8",
    "huggingface-hub>=0.34",
    "httpx>=0.28",
    "filelock>=3.18",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "opencc-python-reimplemented>=0.1.7",
    "psutil>=7",
]

[project.scripts]
ownsei = "onsei.cli:app"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/onsei"]
