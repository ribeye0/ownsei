<svg xmlns="http://www.w3.org/2000/svg" width="768" height="632" viewBox="0 0 768 632" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
  <title id="title">Ownsei 的語音辨識與翻譯架構</title>
  <desc id="desc">日語音軌經 FireRedVAD 切分，再由 speech.cpp 執行 Haas JA F16，轉成帶時間戳的日文逐字稿。llama.cpp 執行 Index-Nailong-9B，接收待譯句與前後日文、術語、風格及選用的人物譯名。中文譯文可匯出，也可供下一批翻譯參照。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto"><path d="M0 0 12 6 0 12 2.5 6Z" fill="#203d52"/></marker>
    <marker id="reference" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#81518b"/></marker>
    <style>
      text{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#203548}
      .section{font:bold 22px 'Noto Serif CJK TC','Songti TC',serif}
      .letter{font:normal 700 20px Georgia,serif}
      .framework{font:bold 28px Georgia,'Times New Roman',serif}
      .model{font-size:27px;font-weight:bold}
      .label{font-size:17px;font-weight:bold}
      .note{font-size:15px;font-weight:600;fill:#354e5e}
      .refnote{font-size:15px;font-weight:600;fill:#6f427c}
      .flow,.ref{fill:none;stroke:#203d52;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}
      .ref{stroke:#81518b;stroke-width:2.4;stroke-dasharray:6 4;marker-end:url(#reference)}
    </style>
  </defs>

  <rect width="768" height="632" fill="white"/>
  <rect x="12" y="12" width="744" height="282" rx="9" fill="#f2f8fb" stroke="#bed4df"/>
  <rect x="12" y="308" width="744" height="280" rx="9" fill="#f9f6fa" stroke="#d9cbdf"/>
  <g class="letter">
    <text x="32" y="46">(a)</text><text x="32" y="342">(b)</text>
  </g>
  <g class="section">
    <text x="71" y="46">語音辨識</text><text x="71" y="342">上下文翻譯</text>
  </g>

  <!-- Side-by-side icon and caption keep the waveform clear of the input label. -->
  <rect x="32" y="77" width="197" height="58" rx="9" fill="white" stroke="#a1c3d0"/>
  <g transform="translate(79 106) scale(.65)" fill="none" stroke="#24778d" stroke-width="3.2" stroke-linecap="round">
    <path d="M-44 -3v6m8 -13v20m8 -16v12m8 -23v34m8 -39v44m8 -32v20m8 -14v8m8 -17v26m8 -32v38m8 -28v18m8 -13v8m8 -7v6"/>
  </g>
  <text x="127" y="113" class="label">日語音軌</text>
  <path class="flow" d="M131 137V164"/>
  <rect x="32" y="168" width="197" height="58" rx="11" fill="#d5ece5" stroke="#55927e" stroke-width="1.5"/>
  <text x="131" y="192" text-anchor="middle" class="label">FireRedVAD</text>
  <text x="131" y="214" text-anchor="middle" class="note">語音區段偵測</text>

  <rect x="270" y="54" width="392" height="157" rx="10" fill="#dcecf3" stroke="#4f849d" stroke-width="1.8"/>
  <text x="294" y="91" class="framework">speech.cpp</text>
  <rect x="293" y="104" width="346" height="88" rx="7" fill="white" stroke="#77a6ba" stroke-width="1.5"/>
  <g transform="translate(312 132) scale(.94)" stroke="#256b84" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="0" width="19" height="32" rx="9" fill="#b5dfe8" stroke-width="2.8"/>
    <path d="M0 20v3a14.5 14.5 0 0 0 29 0v-3M14.5 38v9m-8 0h16" fill="none" stroke-width="3"/>
    <path d="M36 24h6l3 -8 5 16 5 -20 4 12h8" fill="none" stroke-width="2.5"/>
    <path d="M72 4h34a4 4 0 0 1 4 4v26a4 4 0 0 1 -4 4H86l-10 8v-8h-4a4 4 0 0 1 -4 -4V8a4 4 0 0 1 4 -4Z" fill="#e3f3f6" stroke-width="2.5"/>
    <text x="89" y="29" text-anchor="middle" font-size="21" stroke="none">あ</text>
  </g>
  <text x="447" y="144" class="model">Haas JA F16</text>
  <text x="447" y="171" class="note">ASR · 日語語音轉文字</text>
  <path class="flow" d="M232 197H251V148H290"/>

  <path class="flow" d="M466 194V232"/>
  <path d="M348 236H570L584 250V277H348Z" fill="white" stroke="#497b91" stroke-width="1.6"/>
  <path d="M570 236V250H584" fill="#d9ebf1" stroke="#497b91" stroke-width="1.3"/>
  <text x="466" y="263" text-anchor="middle" class="label">帶時間戳的日文逐字稿</text>

  <rect x="270" y="358" width="392" height="121" rx="10" fill="#eadff0" stroke="#886399" stroke-width="1.8"/>
  <text x="294" y="395" class="framework">llama.cpp</text>
  <rect x="293" y="408" width="346" height="53" rx="7" fill="white" stroke="#9c79a9" stroke-width="1.5"/>
  <text x="466" y="444" text-anchor="middle" class="model">Index-Nailong-9B</text>
  <path class="flow" d="M466 279V405"/>
  <text x="484" y="338" class="note">待譯句與前後日文</text>

  <g fill="white" stroke="#ad8ab7" stroke-width="1.4">
    <rect x="32" y="366" width="197" height="34" rx="17"/>
    <rect x="32" y="418" width="197" height="34" rx="17"/>
    <rect x="32" y="470" width="197" height="34" rx="17"/>
  </g>
  <g text-anchor="middle" class="note">
    <text x="131" y="389">全局／專案術語</text>
    <text x="131" y="441">翻譯風格指引</text>
    <text x="131" y="493">人物譯名記憶（選用）</text>
  </g>
  <path class="ref" d="M232 383H251V419H290"/>
  <path class="ref" d="M232 435H290"/>
  <path class="ref" d="M232 487H251V451H290"/>

  <path class="flow" d="M466 463V499"/>
  <ellipse cx="466" cy="524" rx="74" ry="21" fill="#d9ecdf" stroke="#608d70" stroke-width="1.6"/>
  <text x="466" y="531" text-anchor="middle" class="label">中文譯文</text>
  <path class="ref" d="M543 524H726V435H642"/>
  <text x="710" y="511" text-anchor="end" class="refnote">前批譯文供下批參照</text>
  <path class="flow" d="M466 547V561"/>
  <text x="466" y="580" text-anchor="middle" class="label">匯出字幕</text>

  <g class="note">
    <path class="flow" d="M222 609H259"/><text x="271" y="615">主要資料流</text>
    <path class="ref" d="M403 609H440"/><text x="452" y="615">翻譯參照資料</text>
  </g>
</svg>
