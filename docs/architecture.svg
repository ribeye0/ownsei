<svg xmlns="http://www.w3.org/2000/svg" width="800" height="678" viewBox="0 0 800 678" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
  <title id="title">Ownsei 的語音辨識與翻譯架構</title>
  <desc id="desc">日語音軌經 FireRedVAD 切分，再由 speech.cpp 執行 Haas JA F16，轉成帶時間戳的日文逐字稿。llama.cpp 執行 Index-Nailong-9B，接收待譯句與前後日文、術語、風格及選用的人物譯名。中文譯文可匯出，也可供下一批翻譯參照。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto"><path d="M0 0 12 6 0 12 2.5 6Z" fill="#203d52"/></marker>
    <marker id="reference" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#81518b"/></marker>
    <style>
      text{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#203548}
      .section{font:bold 22px 'Noto Serif CJK TC','Songti TC',serif}
      .letter{font:italic bold 22px Georgia,serif}
      .framework{font:bold 28px Georgia,'Times New Roman',serif}
      .model{font-size:27px;font-weight:bold}
      .label{font-size:17px;font-weight:bold}
      .note{font-size:15px;fill:#405865}
      .refnote{font-size:15px;fill:#754781}
      .flow,.ref{fill:none;stroke:#203d52;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}
      .ref{stroke:#81518b;stroke-width:2.4;stroke-dasharray:6 4;marker-end:url(#reference)}
    </style>
  </defs>

  <rect width="800" height="678" fill="#fff"/>
  <rect x="13" y="12" width="774" height="307" rx="9" fill="#f2f8fb" stroke="#bed4df"/>
  <rect x="13" y="333" width="774" height="308" rx="9" fill="#f9f6fa" stroke="#d9cbdf"/>
  <text x="32" y="45" class="letter">(a)</text><text x="76" y="45" class="section">語音辨識</text>
  <text x="32" y="366" class="letter">(b)</text><text x="76" y="366" class="section">上下文翻譯</text>

  <!-- Audio input and voice activity detection. -->
  <g transform="translate(132 94)" fill="none" stroke="#24778d" stroke-width="3.6" stroke-linecap="round">
    <path d="M-44 -3v6m8 -13v20m8 -16v12m8 -23v34m8 -39v44m8 -32v20m8 -14v8m8 -17v26m8 -32v38m8 -28v18m8 -13v8m8 -7v6"/>
  </g>
  <text x="132" y="137" text-anchor="middle" class="label">日語音軌</text>
  <path class="flow" d="M132 145V177"/>
  <rect x="43" y="181" width="178" height="59" rx="14" fill="#d5ece5" stroke="#55927e" stroke-width="1.7"/>
  <text x="132" y="207" text-anchor="middle" class="label">FireRedVAD</text>
  <text x="132" y="229" text-anchor="middle" class="note">語音區段偵測</text>

  <!-- Each inference engine encloses the model it executes. -->
  <rect x="284" y="43" width="438" height="177" rx="11" fill="#dcecf3" stroke="#4f849d" stroke-width="1.9"/>
  <text x="307" y="81" class="framework">speech.cpp</text>
  <rect x="312" y="96" width="382" height="100" rx="8" fill="#fff" stroke="#77a6ba" stroke-width="1.6"/>
  <g transform="translate(331 122)" stroke="#256b84" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="0" width="19" height="32" rx="9" fill="#b5dfe8" stroke-width="2.8"/>
    <path d="M0 20v3a14.5 14.5 0 0 0 29 0v-3M14.5 38v9m-8 0h16" fill="none" stroke-width="3"/>
    <path d="M36 24h6l3 -8 5 16 5 -20 4 12h8" fill="none" stroke-width="2.5"/>
    <path d="M72 4h34a4 4 0 0 1 4 4v26a4 4 0 0 1 -4 4H86l-10 8v-8h-4a4 4 0 0 1 -4 -4V8a4 4 0 0 1 4 -4Z" fill="#e3f3f6" stroke-width="2.5"/>
    <text x="89" y="29" text-anchor="middle" font-size="21" stroke="none">あ</text>
  </g>
  <text x="470" y="143" class="model">Haas JA F16</text>
  <text x="470" y="172" class="note">ASR · 日語語音轉文字</text>
  <path class="flow" d="M224 210H255V150H309"/>
  <path class="flow" d="M500 198V248"/>
  <path d="M390 253h207l14 14v38H390Z" fill="#fff" stroke="#497b91" stroke-width="1.7"/>
  <path d="M597 253v14h14" fill="#d9ebf1" stroke="#497b91" stroke-width="1.4"/>
  <text x="500" y="285" text-anchor="middle" class="label">帶時間戳的日文逐字稿</text>

  <rect x="279" y="375" width="363" height="137" rx="11" fill="#eadff0" stroke="#886399" stroke-width="1.9"/>
  <text x="303" y="412" class="framework">llama.cpp</text>
  <rect x="318" y="429" width="293" height="60" rx="7" fill="#fff" stroke="#9c79a9" stroke-width="1.7"/>
  <text x="465" y="469" text-anchor="middle" class="model">Index-Nailong-9B</text>
  <path class="flow" d="M500 307V425"/>
  <text x="515" y="354" class="note">待譯句與前後日文</text>

  <g fill="#fff" stroke="#ad8ab7" stroke-width="1.5">
    <rect x="36" y="392" width="186" height="32" rx="16"/>
    <rect x="36" y="444" width="186" height="32" rx="16"/>
    <rect x="36" y="496" width="186" height="32" rx="16"/>
  </g>
  <g text-anchor="middle" class="note">
    <text x="129" y="414">全局／專案術語</text>
    <text x="129" y="466">翻譯風格指引</text>
    <text x="129" y="518">人物譯名記憶（選用）</text>
  </g>
  <path class="ref" d="M224 408H248V442H315"/>
  <path class="ref" d="M224 460H315"/>
  <path class="ref" d="M224 512H248V476H315"/>

  <path class="flow" d="M464 491V537"/>
  <ellipse cx="464" cy="561" rx="76" ry="21" fill="#d9ecdf" stroke="#608d70" stroke-width="1.7"/>
  <text x="464" y="568" text-anchor="middle" class="label">中文譯文</text>
  <path class="ref" d="M542 561H740V460H614"/>
  <text x="725" y="551" text-anchor="end" class="refnote">前批譯文供下批參照</text>
  <path class="flow" d="M464 584V603"/>
  <text x="464" y="628" text-anchor="middle" class="label">匯出字幕</text>

  <path class="flow" d="M32 661H72"/><text x="84" y="666" class="note">主要資料流</text>
  <path class="ref" d="M212 661H252"/><text x="264" y="666" class="note">翻譯參照資料</text>
</svg>
