<svg xmlns="http://www.w3.org/2000/svg" width="744" height="588" viewBox="0 0 744 588" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Ownsei speech recognition and translation pipeline</title>
  <desc id="desc">FireRedVAD detects speech in Japanese audio. Haas JA F16 runs in speech.cpp and produces a timestamped Japanese transcript. Index-Nailong-9B runs in llama.cpp and translates each batch using surrounding Japanese dialogue, glossary entries, style guidelines and optional character name memory. Chinese translations can be exported as subtitles or used as context for the next batch.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto"><path d="M0 0 12 6 0 12 2.5 6Z" fill="#203d52"/></marker>
    <marker id="reference" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#81518b"/></marker>
    <style>
      text{font-family:'Noto Sans',Arial,'Noto Sans CJK JP',sans-serif;fill:#203548}
      .section{font:bold 20px Georgia,'Times New Roman',serif}
      .letter{font:italic bold 20px Georgia,serif}
      .framework{font:bold 28px Georgia,'Times New Roman',serif}
      .model{font-size:27px;font-weight:bold}
      .label{font-size:17px;font-weight:bold}
      .note{font-size:15px;fill:#405865}
      .refnote{font-size:15px;fill:#754781}
      .flow,.ref{fill:none;stroke:#203d52;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}
      .ref{stroke:#81518b;stroke-width:2.4;stroke-dasharray:6 4;marker-end:url(#reference)}
    </style>
  </defs>

  <rect width="744" height="588" fill="white"/>
  <rect x="12" y="10" width="720" height="265" rx="9" fill="#f2f8fb" stroke="#bed4df"/>
  <rect x="12" y="286" width="720" height="262" rx="9" fill="#f9f6fa" stroke="#d9cbdf"/>
  <g class="letter">
    <text x="30" y="39">(a)</text><text x="30" y="315">(b)</text>
  </g>
  <g class="section">
    <text x="67" y="39">Speech recognition</text>
    <text x="67" y="315">Context-aware translation</text>
  </g>

  <!-- The two engine frames share a centerline with the transcript and output. -->
  <rect x="260" y="41" width="376" height="149" rx="10" fill="#dcecf3" stroke="#4f849d" stroke-width="1.8"/>
  <text x="282" y="75" class="framework">speech.cpp</text>
  <rect x="282" y="89" width="332" height="82" rx="7" fill="white" stroke="#77a6ba" stroke-width="1.5"/>
  <g transform="translate(301 112)" stroke="#256b84" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="0" width="19" height="32" rx="9" fill="#b5dfe8" stroke-width="2.8"/>
    <path d="M0 20v3a14.5 14.5 0 0 0 29 0v-3M14.5 38v9m-8 0h16" fill="none" stroke-width="3"/>
    <path d="M36 24h6l3 -8 5 16 5 -20 4 12h8" fill="none" stroke-width="2.5"/>
    <path d="M72 4h34a4 4 0 0 1 4 4v26a4 4 0 0 1 -4 4H86l-10 8v-8h-4a4 4 0 0 1 -4 -4V8a4 4 0 0 1 4 -4Z" fill="#e3f3f6" stroke-width="2.5"/>
    <text x="89" y="29" text-anchor="middle" font-size="21" stroke="none">あ</text>
  </g>
  <text x="429" y="128" class="model">Haas JA F16</text>
  <text x="429" y="150" class="note">Japanese speech to text</text>

  <g transform="translate(131 77)" fill="none" stroke="#24778d" stroke-width="3.2" stroke-linecap="round">
    <path d="M-44 -3v6m8 -13v20m8 -16v12m8 -23v34m8 -39v44m8 -32v20m8 -14v8m8 -17v26m8 -32v38m8 -28v18m8 -13v8m8 -7v6"/>
  </g>
  <text x="131" y="113" text-anchor="middle" class="label">Japanese audio</text>
  <path class="flow" d="M131 120V137"/>
  <rect x="32" y="141" width="198" height="50" rx="11" fill="#d5ece5" stroke="#55927e" stroke-width="1.5"/>
  <text x="131" y="162" text-anchor="middle" class="label">FireRedVAD</text>
  <text x="131" y="182" text-anchor="middle" class="note">Voice activity detection</text>
  <path class="flow" d="M232 165H249V131H279"/>

  <path class="flow" d="M448 173V211"/>
  <path d="M333 214H549L563 228V261H333Z" fill="white" stroke="#497b91" stroke-width="1.6"/>
  <path d="M549 214V228H563" fill="#d9ebf1" stroke="#497b91" stroke-width="1.3"/>
  <text x="448" y="236" text-anchor="middle" class="label">Japanese transcript</text>
  <text x="448" y="254" text-anchor="middle" class="note">with timestamps</text>

  <rect x="260" y="329" width="376" height="115" rx="10" fill="#eadff0" stroke="#886399" stroke-width="1.8"/>
  <text x="282" y="363" class="framework">llama.cpp</text>
  <rect x="282" y="375" width="332" height="52" rx="7" fill="white" stroke="#9c79a9" stroke-width="1.5"/>
  <text x="448" y="411" text-anchor="middle" class="model">Index-Nailong-9B</text>
  <path class="flow" d="M448 263V372"/>
  <text x="462" y="307" class="note">Target lines and nearby dialogue</text>

  <!-- Each conditioning input has its own arrowhead at the model boundary. -->
  <g fill="white" stroke="#ad8ab7" stroke-width="1.4">
    <rect x="32" y="341" width="198" height="31" rx="15.5"/>
    <rect x="32" y="386" width="198" height="31" rx="15.5"/>
    <rect x="32" y="431" width="198" height="31" rx="15.5"/>
  </g>
  <g text-anchor="middle" class="note">
    <text x="131" y="362">Global / project glossary</text>
    <text x="131" y="407">Translation style guide</text>
    <text x="131" y="452">Name memory (optional)</text>
  </g>
  <path class="ref" d="M232 356H245V386H279"/>
  <path class="ref" d="M232 401H279"/>
  <path class="ref" d="M232 447H245V416H279"/>

  <path class="flow" d="M448 429V459"/>
  <ellipse cx="448" cy="482" rx="102" ry="20" fill="#d9ecdf" stroke="#608d70" stroke-width="1.6"/>
  <text x="448" y="488" text-anchor="middle" class="label">Chinese translation</text>
  <path class="ref" d="M552 482H700V401H617"/>
  <text x="690" y="473" text-anchor="end" class="refnote">Next-batch context</text>
  <path class="flow" d="M448 504V519"/>
  <text x="448" y="538" text-anchor="middle" class="label">Subtitle export</text>

  <g class="note">
    <path class="flow" d="M173 568H210"/><text x="222" y="573">Main data flow</text>
    <path class="ref" d="M380 568H417"/><text x="429" y="573">Translation context</text>
  </g>
</svg>
